name: Update standings

on:
  schedule:
    - cron: "37 11 * * *"        # daily ~6:37am Central; off-peak minute, GitHub often runs it late
  push:
    branches: [main]
    paths:
      - rosters.json
      - scoring.json
      - aliases.json
      - update.py
  workflow_dispatch: {}          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  actions: write        # lets the job kick off the Pages deploy workflow

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull NHL stats and rescore
        run: python update.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "bhl-bot"
          git config user.email "bhl-bot@users.noreply.github.com"
          git add standings.json players.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update standings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the built-in token never trigger other workflows,
      # so the Pages deploy (main.yml) won't run on its own. Start it directly
      # (workflow_dispatch is the one trigger this token is allowed to fire).
      - name: Republish the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --repo "${{ github.repository }}" --ref main
