name: Update BHL standings

on:
  schedule:
    # 12:15 UTC daily = 7:15am Central / 6:15am during standard time.
    # Late enough that every West Coast game from the night before is final.
    - cron: "15 12 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "rosters.json"      # re-score immediately when you edit a roster
      - "scoring.json"
      - "aliases.json"
      - "update.py"

permissions:
  contents: write

concurrency:
  group: bhl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull NHL stats and rescore the league
        run: python update.py

      - name: Commit updated standings
        run: |
          git config user.name  "BHL Bot"
          git config user.email "actions@github.com"
          git add standings.json players.json
          if git diff --staged --quiet; then
            echo "No scoring changes today."
          else
            git commit -m "Standings update $(date -u +'%Y-%m-%d')"
            git push
          fi
